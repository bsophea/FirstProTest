<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reanmore</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: black;
      }
      .flagContainer {
        width: 500px;
        height: 320px;
      }
      .middleFlag {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50%;
        background-color: #e00025;
      }
      .flagContainer::before,
      .flagContainer::after {
        content: "";
        display: block;
        height: 25%;
        background-color: #032ea1;
      }
      .angkor {
        width: 35%;
        height: 70%;
      }
      .middle {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 30%;
      }
      .middle::before,
      .middle::after {
        content: "";
        display: block;
        background-color: white;
        width: 79%;
        height: 50%;
      }
      .middle::after {
        height: 50%;
        width: 73%;
      }
      .bottom {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 30%;
      }
      .stair {
        flex-grow: 1;
        width: 100%;
        background-color: white;
      }
      .stair:first-child {
        width: 85%;
      }
      .stair:nth-child(2) {
        width: 90%;
      }
      .stair:nth-child(3) {
        width: 95%;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: end;
        height: 40%;
        padding: 0 1rem;
      }
      .topLeft,
      .topRight {
        width: 50px;
        height: 55%;
        background-color: white;
        clip-path: polygon(50% 0, 25% 100%, 75% 100%);
      }
      .topMiddle {
        width: 50%;
        height: 100%;
        background-color: white;
        clip-path: polygon(50% 0, 25% 100%, 75% 100%);
      }
    </style>
  </head>
  <body>
    <div class="flagContainer">
      <div class="middleFlag">
        <div class="angkor">
          <div class="top">
            <div class="topLeft"></div>
            <div class="topMiddle"></div>
            <div class="topRight"></div>
          </div>
          <div class="middle"></div>
          <div class="bottom">
            <div class="stair"></div>
            <div class="stair"></div>
            <div class="stair"></div>
            <div class="stair"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
